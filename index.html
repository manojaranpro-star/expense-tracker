<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Tracker</title>

<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #172033;
  --muted: #6b7280;
  --border: #e6e9f0;
  --primary: #4f46e5;
  --green: #16a34a;
  --red: #dc2626;
  --shadow: 0 8px 25px rgba(23,32,51,.07);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, Segoe UI, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 1150px;
  margin: auto;
  padding: 24px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
  gap: 15px;
}

h1 {
  margin: 0;
  font-size: 28px;
}

.subtitle {
  color: var(--muted);
  margin-top: 5px;
  font-size: 14px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 11px 15px;
  font-weight: 600;
  cursor: pointer;
}

.primary {
  background: var(--primary);
  color: white;
}

.danger {
  background: #fee2e2;
  color: #b91c1c;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  box-shadow: var(--shadow);
}

.stat-label {
  color: var(--muted);
  font-size: 13px;
}

.stat {
  font-size: 27px;
  font-weight: 750;
  margin-top: 8px;
}

.green {
  color: var(--green);
}

.red {
  color: var(--red);
}

.main {
  display: grid;
  grid-template-columns: 1.25fr .75fr;
  gap: 16px;
  margin-top: 16px;
}

.section-title {
  font-size: 17px;
  font-weight: 700;
  margin: 0 0 15px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

label {
  font-size: 13px;
  color: var(--muted);
  display: block;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  padding: 11px 12px;
  border: 1px solid #dfe3eb;
  border-radius: 10px;
  background: white;
  font-size: 14px;
  outline: none;
}

input:focus,
select:focus {
  border-color: var(--primary);
}

.full {
  grid-column: 1 / -1;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 13px;
}

.filters {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 10px;
  margin-bottom: 14px;
}

.table-wrap {
  overflow: auto;
}

.transaction {
  display: grid;
  grid-template-columns: 1.5fr .9fr .7fr .7fr 50px;
  align-items: center;
  gap: 10px;
  padding: 13px 4px;
  border-bottom: 1px solid var(--border);
}

.transaction:last-child {
  border-bottom: 0;
}

.name {
  font-weight: 650;
}

.small {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
}

.amount {
  font-weight: 700;
  text-align: right;
}

.income {
  color: var(--green);
}

.expense {
  color: var(--red);
}

.icon-btn {
  background: #f3f4f6;
  padding: 8px 10px;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 30px;
}

canvas {
  width: 100%;
  height: 230px;
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal.show {
  display: flex;
}

.modal-box {
  background: white;
  border-radius: 18px;
  padding: 22px;
  width: min(470px, 100%);
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
}

.close {
  float: right;
  background: #f3f4f6;
  border-radius: 50%;
  width: 34px;
  height: 34px;
  padding: 0;
}

footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin: 22px;
}

@media (max-width: 800px) {
  .grid,
  .main {
    grid-template-columns: 1fr;
  }

  .filters {
    grid-template-columns: 1fr;
  }

  .transaction {
    grid-template-columns: 1fr auto;
  }

  .transaction > *:nth-child(2),
  .transaction > *:nth-child(3) {
    display: none;
  }

  .amount {
    text-align: left;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div>
    <h1>Expense Tracker</h1>
    <div class="subtitle">
      Track your money simply and clearly
    </div>
  </div>

  <button class="primary" onclick="openModal()">
    ＋ Add Transaction
  </button>
</header>

<!-- Dashboard -->

<div class="grid">

  <div class="card">
    <div class="stat-label">Current Balance</div>
    <div id="balance" class="stat">₹0.00</div>
  </div>

  <div class="card">
    <div class="stat-label">Total Income</div>
    <div id="income" class="stat green">₹0.00</div>
  </div>

  <div class="card">
    <div class="stat-label">Total Expense</div>
    <div id="expense" class="stat red">₹0.00</div>
  </div>

</div>

<!-- Main -->

<div class="main">

  <!-- Transactions -->

  <div class="card">

    <div class="section-title">
      Transactions
    </div>

    <div class="filters">

      <select id="filterType" onchange="render()">
        <option value="all">All types</option>
        <option value="income">Income</option>
        <option value="expense">Expense</option>
      </select>

      <select id="filterCategory" onchange="render()">
        <option value="all">All categories</option>
      </select>

      <input
        id="search"
        placeholder="Search..."
        oninput="render()"
      >

    </div>

    <div id="list"></div>

  </div>

  <!-- Chart -->

  <div class="card">

    <div class="section-title">
      6-Month Expense Overview
    </div>

    <canvas
      id="chart"
      width="520"
      height="260">
    </canvas>

  </div>

</div>

<footer>
  Data is stored locally in your browser.
  No account or server required.
</footer>

</div>

<!-- Add Transaction Modal -->

<div class="modal" id="modal">

  <div class="modal-box">

    <button class="close" onclick="closeModal()">
      ×
    </button>

    <h2>Add Transaction</h2>

    <form id="form">

      <div class="form-grid">

        <div class="full">

          <label>Type</label>

          <select id="type">

            <option value="expense">
              Expense
            </option>

            <option value="income">
              Income
            </option>

          </select>

        </div>

        <div class="full">

          <label>Description</label>

          <input
            id="description"
            required
            placeholder="e.g. Groceries">

        </div>

        <div>

          <label>Amount (₹)</label>

          <input
            id="amount"
            type="number"
            min="0.01"
            step="0.01"
            required>

        </div>

        <div>

          <label>Date</label>

          <input
            id="date"
            type="date"
            required>

        </div>

        <div class="full">

          <label>Category</label>

          <select id="category"></select>

        </div>

      </div>

      <div class="actions">

        <button
          class="primary"
          type="submit">
          Save Transaction
        </button>

        <button
          type="button"
          onclick="closeModal()">
          Cancel
        </button>

      </div>

    </form>

  </div>

</div>

<script>

const categories = {

  expense: [
    "Food",
    "Travel",
    "Shopping",
    "Bills",
    "Health",
    "Education",
    "Entertainment",
    "Home",
    "Other"
  ],

  income: [
    "Salary",
    "Freelance",
    "Business",
    "Gift",
    "Other"
  ]

};

let transactions =
  JSON.parse(
    localStorage.getItem("expenseTrackerData") || "[]"
  );

const money = n =>
  new Intl.NumberFormat("en-IN", {
    style: "currency",
    currency: "INR"
  }).format(n || 0);

function today() {

  return new Date()
    .toISOString()
    .slice(0, 10);

}

document.getElementById("date").value =
  today();

function updateCategoryOptions() {

  const type =
    document.getElementById("type").value;

  const category =
    document.getElementById("category");

  category.innerHTML =
    categories[type]
      .map(x => `<option>${x}</option>`)
      .join("");

}

document
  .getElementById("type")
  .addEventListener(
    "change",
    updateCategoryOptions
  );

updateCategoryOptions();

function openModal() {

  document
    .getElementById("modal")
    .classList.add("show");

  document
    .getElementById("description")
    .focus();

}

function closeModal() {

  document
    .getElementById("modal")
    .classList.remove("show");

  document
    .getElementById("form")
    .reset();

  document.getElementById("date").value =
    today();

  updateCategoryOptions();

}

function save() {

  localStorage.setItem(
    "expenseTrackerData",
    JSON.stringify(transactions)
  );

}

function deleteTx(id) {

  if (
    confirm(
      "Delete this transaction?"
    )
  ) {

    transactions =
      transactions.filter(
        t => t.id !== id
      );

    save();

    render();

  }

}

document
  .getElementById("form")
  .addEventListener(
    "submit",
    e => {

      e.preventDefault();

      transactions.unshift({

        id: Date.now().toString(),

        type:
          document.getElementById(
            "type"
          ).value,

        description:
          document.getElementById(
            "description"
          ).value.trim(),

        amount:
          Number(
            document.getElementById(
              "amount"
            ).value
          ),

        date:
          document.getElementById(
            "date"
          ).value,

        category:
          document.getElementById(
            "category"
          ).value

      });

      save();

      closeModal();

      render();

    }
  );

function render() {

  const inc =
    transactions
      .filter(
        t => t.type === "income"
      )
      .reduce(
        (a, t) => a + t.amount,
        0
      );

  const exp =
    transactions
      .filter(
        t => t.type === "expense"
      )
      .reduce(
        (a, t) => a + t.amount,
        0
      );

  document.getElementById(
    "income"
  ).textContent = money(inc);

  document.getElementById(
    "expense"
  ).textContent = money(exp);

  document.getElementById(
    "balance"
  ).textContent = money(inc - exp);

  const fc =
    document.getElementById(
      "filterCategory"
    );

  const old =
    fc.value || "all";

  const cats =
    [
      ...new Set(
        transactions.map(
          t => t.category
        )
      )
    ].sort();

  fc.innerHTML =
    '<option value="all">All categories</option>' +
    cats
      .map(
        c =>
          `<option>${c}</option>`
      )
      .join("");

  if (cats.includes(old)) {
    fc.value = old;
  }

  const type =
    document.getElementById(
      "filterType"
    ).value;

  const cat =
    fc.value;

  const q =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const rows =
    transactions.filter(
      t =>

        (type === "all" ||
          t.type === type)

        &&

        (cat === "all" ||
          t.category === cat)

        &&

        (
          !q ||
          t.description
            .toLowerCase()
            .includes(q) ||

          t.category
            .toLowerCase()
            .includes(q)
        )
    );

  const list =
    document.getElementById(
      "list"
    );

  list.innerHTML =
    rows.length

      ? rows.map(t => `

        <div class="transaction">

          <div>

            <div class="name">
              ${escapeHtml(
                t.description
              )}
            </div>

            <div class="small">
              ${escapeHtml(
                t.category
              )}
              ·
              ${formatDate(t.date)}
            </div>

          </div>

          <div class="small">
            ${
              t.type === "income"
                ? "Income"
                : "Expense"
            }
          </div>

          <div></div>

          <div
            class="amount ${t.type}"
          >
            ${
              t.type === "income"
                ? "+"
                : "−"
            }${money(t.amount)}
          </div>

          <button
            class="icon-btn"
            onclick="deleteTx('${t.id}')">
            🗑️
          </button>

        </div>

      `).join("")

      :

      `<div class="empty">
        No transactions found.
      </div>`;

  drawChart();

}

function escapeHtml(s) {

  return s.replace(
    /[&<>"']/g,
    m => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[m])
  );

}

function formatDate(s) {

  return new Date(
    s + "T00:00:00"
  ).toLocaleDateString(
    "en-IN",
    {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }
  );

}

function drawChart() {

  const canvas =
    document.getElementById(
      "chart"
    );

  const ctx =
    canvas.getContext("2d");

  const dpr =
    devicePixelRatio || 1;

  const w =
    canvas.clientWidth || 520;

  const h = 230;

  canvas.width = w * dpr;
  canvas.height = h * dpr;

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

  ctx.clearRect(
    0,
    0,
    w,
    h
  );

  const now = new Date();

  const months = [];

  for (
    let i = 5;
    i >= 0;
    i--
  ) {

    const d =
      new Date(
        now.getFullYear(),
        now.getMonth() - i,
        1
      );

    months.push({

      label:
        d.toLocaleDateString(
          "en-IN",
          { month: "short" }
        ),

      y:
        d.getFullYear(),

      m:
        d.getMonth(),

      v: 0

    });

  }

  transactions
    .filter(
      t => t.type === "expense"
    )
    .forEach(t => {

      const d =
        new Date(
          t.date + "T00:00:00"
        );

      const x =
        months.find(
          m =>
            m.y === d.getFullYear() &&
            m.m === d.getMonth()
        );

      if (x) {
        x.v += t.amount;
      }

    });

  const max =
    Math.max(
      ...months.map(
        x => x.v
      ),
      1
    );

  const pad = 35;
  const chartH = 165;
  const base = 195;

  const gap =
    (w - pad * 2) /
    months.length;

  ctx.strokeStyle =
    "#e5e7eb";

  ctx.lineWidth = 1;

  for (
    let i = 0;
    i < 4;
    i++
  ) {

    const y =
      base -
      (chartH / 3) * i;

    ctx.beginPath();

    ctx.moveTo(
      pad,
      y
    );

    ctx.lineTo(
      w - 15,
      y
    );

    ctx.stroke();

  }

  months.forEach(
    (x, i) => {

      const bh =
        (x.v / max) *
        chartH;

      const bw =
        Math.min(
          42,
          gap * .55
        );

      const bx =
        pad +
        i * gap +
        (gap - bw) / 2;

      const by =
        base - bh;

      ctx.fillStyle =
        "#4f46e5";

      ctx.fillRect(
        bx,
        by,
        bw,
        bh
      );

      ctx.fillStyle =
        "#6b7280";

      ctx.font =
        "12px Segoe UI";

      ctx.textAlign =
        "center";

      ctx.fillText(
        x.label,
        bx + bw / 2,
        215
      );

      if (x.v) {

        ctx.fillStyle =
          "#374151";

        ctx.font =
          "11px Segoe UI";

        ctx.fillText(
          "₹" +
          Math.round(
            x.v
          ).toLocaleString(
            "en-IN"
          ),

          bx + bw / 2,
          by - 6
        );

      }

    }
  );

}

render();

window.addEventListener(
  "resize",
  drawChart
);

</script>

</body>
</html>
